name: Bug report
description: Something in crossrepo does not work as expected.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: xr-version
    attributes:
      label: crossrepo version
      description: Output of `xr --version`.
      placeholder: "0.0.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: crossrepo runs on Node.js 22.13 or later, or Bun 1.3 or later.
      options:
        - Node.js
        - Bun
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: Output of `node --version` or `bun --version`.
      placeholder: "v22.13.0"
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: git version
      description: Output of `git --version`. crossrepo needs git 2.27 or later.
      placeholder: "git version 2.47.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include any error message.
    validations:
      required: true
  - type: textarea
    id: json-output
    attributes:
      label: Output with --json
      description: Run the same command with `--json` and paste the output. Please remove private paths and repository names first.
      render: json
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and did not find this bug.
          required: true
