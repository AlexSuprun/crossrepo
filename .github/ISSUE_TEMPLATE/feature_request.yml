name: Feature request
description: Suggest a new feature or a change to crossrepo.
labels: ["feature", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make crossrepo better!
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you want to solve? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should crossrepo behave? Example commands and output help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have tried or thought about.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature.
