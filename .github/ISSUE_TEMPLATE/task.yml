name: Task
description: Planned work. For maintainers and existing contributors only.
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: Thanks for planning this work!
  - type: textarea
    id: user-story
    attributes:
      label: User story
      value: |
        As a ...,
        I want ...,
        So that ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "Use Given / When / Then. Example: Given a config with two repos, When I run the command, Then both repos are listed."
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: input
    id: parent-epic
    attributes:
      label: Parent epic
      description: Link to the epic issue as `#N`.
      placeholder: "#1"
