name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Job names are required status checks in the master ruleset. Renaming a job
# or a matrix value means updating the ruleset in the same change.
jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:adapters
      - run: bun run test:commands

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: bun install --frozen-lockfile
      - run: bun run test:smoke

  bun-only:
    name: bun-only (${{ matrix.os }}, ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.4.2", "1.3.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build with the pinned Bun from packageManager, then run with the matrix Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
          no-cache: true
      - name: Check the matrix Bun version
        run: |
          echo "bun $(bun --version)"
          test "$(bun --version)" = "${{ matrix.bun }}"
      - name: Remove Node from PATH
        id: no-node
        run: |
          bun_dir="$(dirname "$(command -v bun)")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            win_dir="$(cygpath -u "$SYSTEMROOT")"
            echo "path=$bun_dir:/usr/bin:/bin:$win_dir/system32:$win_dir" >> "$GITHUB_OUTPUT"
          else
            echo "path=$bun_dir:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_OUTPUT"
          fi
      - name: Check node is not found
        run: |
          export PATH="${{ steps.no-node.outputs.path }}"
          if command -v node; then
            echo "node is still on PATH"
            exit 1
          fi
          echo "node not found"
      - name: Run the smoke tests under Bun only
        env:
          XR_SMOKE_RUNTIMES: bun
        run: |
          export PATH="${{ steps.no-node.outputs.path }}"
          bun --version
          bun --config=bunfig.smoke.toml test ./tests/smoke/*.smoke.ts
